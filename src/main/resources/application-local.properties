# ============================================================
# LOCAL profile — developer's own machine.
#
# This is the DEFAULT profile (set in application.properties).
# It is active automatically when no other profile is specified.
#
# How to activate explicitly:
#   Maven:   ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
#   JAR:     java -jar target/gilded-rose-kata-*.jar --spring.profiles.active=local
#   IDE:     Set env var  SPRING_PROFILES_ACTIVE=local
#            or add VM option  -Dspring.profiles.active=local
#
# Purpose:
#   Full debug visibility for hands-on development.
#   Swagger UI enabled so developers can explore the API interactively.
# ============================================================

# Logging — most verbose; see every application event and SQL/HTTP detail
logging.level.root=INFO
logging.level.com.vinods.gildedrose=DEBUG
logging.level.org.springframework.web=DEBUG

# Swagger UI — enabled; visit http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
