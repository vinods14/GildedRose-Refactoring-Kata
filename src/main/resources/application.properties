# ============================================================
# Base configuration — shared by all profiles.
# Profile-specific files (application-local/dev/prod.properties)
# override these values where they differ.
#
# Default active profile: dev
# To override: see application-local/dev/prod.properties
# ============================================================

spring.application.name=gilded-rose-kata

# Activate the dev profile by default.
# Override at startup — see README.md for examples.
spring.profiles.active=local

# Server
server.port=8080

# SpringDoc / Swagger — paths are the same across all profiles;
# individual profiles enable or disable the UI.
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
