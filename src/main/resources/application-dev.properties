# ============================================================
# DEV profile — shared development / CI server.
#
# How to activate:
#   Maven:   ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
#   JAR:     java -jar target/gilded-rose-kata-*.jar --spring.profiles.active=dev
#   IDE:     Set env var  SPRING_PROFILES_ACTIVE=dev
#            or add VM option  -Dspring.profiles.active=dev
#
# Purpose:
#   Debug-level logging for application code; standard INFO for the framework.
#   Swagger UI enabled so the team can test the API on the shared server.
# ============================================================

# Logging — application code at DEBUG; framework at INFO
logging.level.root=INFO
logging.level.com.vinods.gildedrose=DEBUG

# Swagger UI — enabled; visit http://<dev-host>:8080/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
