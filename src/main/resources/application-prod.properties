# ============================================================
# PROD profile — production server.
#
# How to activate:
#   JAR:     java -jar target/gilded-rose-kata-*.jar --spring.profiles.active=prod
#   Env var: SPRING_PROFILES_ACTIVE=prod  java -jar target/gilded-rose-kata-*.jar
#   Docker:  ENV SPRING_PROFILES_ACTIVE=prod  (in Dockerfile)
#   K8s:     Set in deployment env or ConfigMap:
#              - name: SPRING_PROFILES_ACTIVE
#                value: "prod"
#
# NEVER set spring.profiles.active=prod in application.properties.
# Always supply the prod profile explicitly at deployment time so
# it cannot be activated accidentally in a local or dev environment.
#
# Purpose:
#   Minimal logging — warnings and errors only, to reduce noise and
#   avoid leaking internal details to log aggregators.
#   Swagger UI and API-docs endpoint disabled — exposing them in
#   production is a security risk (API enumeration / information disclosure).
# ============================================================

# Logging — warnings and errors only; no DEBUG output in production
logging.level.root=WARN
logging.level.com.vinods.gildedrose=WARN

# Swagger UI — DISABLED in production (security best practice)
# Re-enabling this in prod without authentication would expose
# the full API surface to unauthenticated users.
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
